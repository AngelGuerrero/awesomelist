services:
  web:
    build:
      context: .
      target: development
      args:
        NODE_VERSION: ${DOCKER_NODE_VERSION:-24.20.0}
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      # Webpack 4 uses chokidar; polling sees changes in Windows bind mounts.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/home/node/.npm

  firestore-tests:
    profiles: ["tools"]
    build:
      context: .
      target: firebase-tests
      args:
        NODE_VERSION: ${DOCKER_NODE_VERSION:-24.20.0}
    init: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - rules_node_modules:/app/tests/firestore/node_modules
      - npm_cache:/home/node/.npm
      - firebase_cache:/home/node/.cache/firebase

volumes:
  node_modules:
  npm_cache:
  rules_node_modules:
  firebase_cache:
